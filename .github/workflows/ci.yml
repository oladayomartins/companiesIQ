name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Retried once: next/font downloads Google Fonts at build time, and a bad
      # response from Google fails the build with no code change involved
      # ("Cannot read properties of null" in next/font's google loader). A real
      # build error fails both attempts, so this only absorbs network flakes.
      - name: Build
        run: npm run build || { echo "::warning::Build failed — retrying once (Google Fonts fetch is flaky in CI)"; sleep 15; npm run build; }
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # No secrets needed: the build prerenders with graceful fallbacks.
          # Live data (Companies House / Nomis / Supabase) is fetched at runtime.

      # Accessibility and layout regressions are cheap to catch and expensive to
      # ship. These run against `next start`, not `next dev`: the dev server's
      # error overlay trips the contrast rules, and dev hides pages whose server
      # HTML is empty (see scripts/ui-checks.mjs).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npm start &
          npx wait-on http://127.0.0.1:3000 --timeout 90000
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: UI checks (accessibility + layout)
        run: npm run check:ui
        env:
          BASE_URL: http://127.0.0.1:3000
